name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      tag:
        description: "Tag for the Docker image"
        type: string
        required: true
      environment:
        description: "Deployment environment (dev or prod)."
        type: string
        required: true
      tag_latest:
        description: "Also tag the image as latest"
        type: boolean
        required: false
        default: false
    secrets:
      DOCKER_PASSWORD:
        required: true

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Database tests
        run: npm run test:db

      - name: Build
        run: npm run build

  build-and-push:
    if: inputs.tag != ''
    permissions:
      contents: read
      packages: read
    uses: equinor/ops-actions/.github/workflows/docker.yml@dae4f55b517888e44a342a5f7d3dfac40580a127 # v9.44.0
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    with:
      environment: ${{ inputs.environment }}
      registry: registry.hub.docker.com
      username: sondresjo
      repository: sondresjo/blobby-volley-tournament
      tag: ${{ inputs.tag }}
      tag_latest: ${{ inputs.tag_latest }}
