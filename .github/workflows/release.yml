name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy to prod (e.g. v1.2.3). Run the workflow from that tag. Leave empty to skip prod deploy."
        type: string
        required: false
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@dae4f55b517888e44a342a5f7d3dfac40580a127 # v9.44.0
    permissions:
      contents: write
      pull-requests: write
      issues: write

  deploy-dev:
    name: Deploy Dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/docker.yml
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    with:
      tag: dev
      environment: dev
      tag_latest: false

  get-tag:
    name: Get Release Tag
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Get release tag
        id: get-tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            gh release view "$INPUT_TAG" --repo "$REPO" > /dev/null
            tag_sha=$(gh api "repos/$REPO/commits/$INPUT_TAG" --jq '.sha')
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Run this workflow from the $INPUT_TAG tag so the image is built from that release" >&2
              exit 1
            fi
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            tag=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  deploy-prod:
    name: Deploy Prod
    needs: [release-please, get-tag]
    if: ${{ always() && needs.get-tag.result == 'success' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/docker.yml
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    with:
      tag: ${{ needs.get-tag.outputs.tag }}
      environment: prod
      tag_latest: true

  update-chart:
    name: Update Chart
    needs: [release-please, deploy-prod, get-tag]
    if: ${{ always() && needs.get-tag.result == 'success' && needs.deploy-prod.result == 'success' }}
    permissions:
      contents: read
    uses: sondresjolyst/tumogroup-charts/.github/workflows/update-chart.yml@e96af8bd95ed381f66a3fd0732c558424337a865 # main
    secrets:
      CHARTS_PAT: ${{ secrets.CHARTS_PAT }}
    with:
      chart_name: blobby-volley-tournament
      tag: ${{ needs.get-tag.outputs.tag }}
